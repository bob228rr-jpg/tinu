<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freaky Tongue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        font-family: "Reenie Beanie", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .ticker,
      .top-links {
        position: fixed;
        top: 24px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
        transform: rotate(-1deg);
        text-shadow: 0.4px 0.3px 0 #111;
      }

      .ticker {
        left: 28px;
      }

      .top-links {
        right: 28px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .top-links a,
      .top-links span {
        color: #111;
        text-decoration: none;
        white-space: nowrap;
      }

      .top-links a:hover {
        text-decoration: underline;
      }

      .tongue {
        width: min(62vw, 560px);
        min-width: 320px;
        height: auto;
        image-rendering: auto;
      }

      @media (max-width: 520px) {
        .ticker,
        .top-links {
          top: 18px;
          font-size: 12px;
        }

        .ticker {
          left: 18px;
        }

        .top-links {
          right: 18px;
          gap: 12px;
        }

        .tongue {
          width: min(72vw, 360px);
          min-width: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="ticker">$tongue</div>

    <nav class="top-links" aria-label="Social links">
      <a href="https://x.com/freaky_tongue_" target="_blank" rel="noreferrer">TWT</a>
      <span>CONTRACT SOON</span>
    </nav>

    <main>
      <img class="tongue" src="./freaky-tongue-emote.gif" alt="Freaky Tongue">
    </main>
  </body>
</html>
